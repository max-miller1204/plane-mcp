[project]
name = "focused-plane-mcp"
version = "0.1.0"
description = "A focused MCP server for self-hosted Plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46,<51",
    "fastmcp==3.2.0",
    "httpx>=0.28.1,<0.29",
    "starlette>=0.46,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-httpx>=0.35,<1",
    "ruff>=0.11,<1",
]

[project.scripts]
plane-mcp = "plane_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plane_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
